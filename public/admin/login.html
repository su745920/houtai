<!DOCTYPE html>
<html lang="ZH-cn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>UZX后台管理系统</title>
    <link rel="stylesheet" href="plugins/layui/css/layui.css">
    <link rel="stylesheet" href="src/css/login.css">
    <style>
        .bib{
            font-size: 20px;
            font-weight: 700;
            width: 12em;
            background: -webkit-gradient(linear,left top,right top,color-stop(34.11%,#01eedd),color-stop(99.99%,#0072f5),to(#01ddcd));
            background: linear-gradient(90deg,#01eedd 34.11%,#0072f5 99.99%,#01ddcd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            text-align: center;
        }
        .bib2{
            font-size: 20px;
            font-weight: 700;
            width: 2m;
            background: -webkit-gradient(linear,left top,right top,color-stop(34.11%,#01eedd),color-stop(99.99%,#0072f5),to(#01ddcd));
            background: linear-gradient(90deg,#01eedd 34.11%,#0072f5 99.99%,#01ddcd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            text-align: center;
        }
    </style>
</head>

<body>
<div style="display: flex;">
    <div style="flex: 1;background: #000000;display: flex;justify-content: center;flex-direction: column;">
        <div style="justify-content: center;text-align: center;">
            <img src="/bibLogin.18360031.89da56d5.png" style="width:400px;height:400px;margin-top:-200px;">

        </div>


    </div>

    <div class="kit-login" style="flex: 1;display: flex;flex-direction: column;">
        <div style="color: #000;margin-top: 300px;text-align: center;display: flex;justify-content: center;margin: 200px auto;display: none;" class="bib">
            UZX交易所业务管理系统
        </div>
        <div class="kit-login-wapper" style="magin:auto auto;">


            <div class="kit-login-form" style="padding: 20px 20px;width: 280px;">
                <h4 class="bib" style="margin: 0;padding:0;" >UZX交易所管理系统</h4>
                <form class="layui-form" style="margin-top:10px;">

                    <div class="kit-login-row" style="border: 1px solid #f7f7f7;height: 35px;border-radius: 4px;z-index:100;width: 270px;">
                        <div class="kit-login-col" style="display:flex;align-items: center">
                            <img src="/u.png" style="width:20px;height:20px;margin: 7.5px;">

                            <input type="text" name="loginName" lay-verify="required" placeholder="用户名" style="flex: 1;border: none;padding-left: 5px;" />

                        </div>
                        <div class="kit-login-col"></div>
                    </div>


                    <div class="kit-login-row" style="border: 1px solid #f7f7f7;height: 35px;border-radius: 4px;z-index:100;width: 270px;">
                        <div class="kit-login-col" style="display:flex;align-items: center">
                            <img src="/pwd.png" style="width:20px;height:20px;margin: 7.5px;">

                            <input type="password" name="password" lay-verify="required" placeholder="密码" style="flex: 1;border: none;padding-left: 5px;" />

                        </div>
                        <div class="kit-login-col"></div>
                    </div>
                    
                    <div class="kit-login-row" style="border: 1px solid #f7f7f7;height: 35px;border-radius: 4px;z-index:100;width: 270px;">
                        <div class="kit-login-col" style="display:flex;align-items: center">
                            <img src="/code.png" style="width:20px;height:20px;margin: 7.5px;">

                            <input type="text" name="google_auth_code" lay-verify="required" placeholder="谷歌验证码" style="flex: 1;border: none;padding-left: 5px;" />

                        </div>
                        <div class="kit-login-col"></div>
                    </div>

                    <!--                <div class="kit-login-row">-->
                    <!--                    <div class="kit-login-col">-->
                    <!--                        <i class="layui-icon">&#xe64c;</i>-->
                    <!--                        <span class="kit-login-input">-->
                    <!--                <input type="password" name="password" lay-verify="required" placeholder="密码" />-->
                    <!--              </span>-->
                    <!--                    </div>-->
                    <!--                    <div class="kit-login-col"></div>-->
                    <!--                </div>-->



                    <div class="kit-login-row">
                        <div class="kit-login-col">
                            <input type="checkbox" name="rememberMe" title="记住帐号" lay-skin="primary">
                        </div>
                    </div>
                    <div class="kit-login-row">
                        <button class="layui-btn kit-login-btn" lay-submit="submit" lay-filter="login_hash"
                                style="background: -webkit-gradient(linear,left top,right top,color-stop(34.11%,#01eedd),color-stop(99.99%,#0072f5),to(#01ddcd));">登录</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<div id="qrcode">
    
</div>

<div class="row" id="popup_google_auth" style="margin:10px;display: none;">
    <!--<input id="google_auth_code" name="google_auth_code" type="text"  autocomplete="off" class="layui-input"  placeholder="请输入验证码">-->
</div>

<script src="plugins/polyfill.min.js"></script>
<script src="plugins/layui/layui.js"></script>
<script>
    layui.use(['layer', 'form'], function() {
        var form = layui.form
            ,$ = layui.$
            ,layer = layui.layer
        $('#forgot').on('click', function() {
            layer.msg('请联系管理员.');
        });
        
        //监听提交
        form.on('submit(login_hash)', function(data) {
            var username = $('input[name="loginName"]').val();
            var password = $('input[name="password"]').val();
            var google_auth_code = $('input[name="google_auth_code"]').val();
            $.ajax({
                url:'/admin/login',
                type:'post',
                dataType:'json',
                data:{
                    username:username,
                    password:password,
                    google_auth_code: google_auth_code
                },
                success:function(data) {
                    if(data.type == 'ok') {
                         window.location="/admin/main";
                        // if(data.message.admin_id) {
                        //     if(data.message.is_google == '') {
                        //         layer.open({
                        //             type: 2,
                        //             area: [400 + 'px', 400 + 'px'],
                        //             fix: false, //不固定
                        //             maxmin: true,
                        //             shade: 0.4,
                        //             title: '谷歌绑定',
                        //             content: '/admin/u_google_auth/getBindQrcode?id=' + data.message.admin_id,
                        //             offset: '20vh',
                        //         });
                        //     }
                        // }else {
                        //      window.location="/admin/main";
                        // }
                        //layer.msg(data.message);
                        //window.location="/winadmin";
                       
                    }else if(data.type=='popup_google_auth'){
                        console.log('popup_google_auth')
                        layer.open({
                            type:1,
                            title:"谷歌验证",
                            content:$('#popup_google_auth'),
                            btn:['确定'],
                            yes:function(index,layero){
                                auth_code = $('#google_auth_code').val();
                                console.log(auth_code)

                                $.ajax({
                                    url:'/admin/login',
                                    type:'post',
                                    dataType:'json',
                                    data:{
                                        username:username,
                                        password:password,
                                        google_auth_code:auth_code
                                    },
                                    success:function(data) {
                                        console.log(data)
                                        if(data.type == 'ok') {
                                            layer.close(index)
                                            //layer.msg(data.message);
                                            window.location="/admin/main";
                                        } else{
                                            layer.msg(data.message);
                                        }
                                    }
                                })
                            }
                        })
                    } else{
                        layer.msg(data.message);
                    }
                }
            })
            return false;
        });
        $(function () { if (top != window) {top.location.href = window.location.href;} })
    });
</script>
</body>

</html>
